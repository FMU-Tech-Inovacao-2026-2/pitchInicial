# Publica o protótipo estático (pasta prototipo/) no GitHub Pages a cada push na main.
# Requer uma vez: Settings > Pages > Source = "GitHub Actions".
name: Protótipo no GitHub Pages

on:
  push:
    branches: [main]
    paths: [prototipo/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: prototipo
      - id: deploy
        uses: actions/deploy-pages@v4
